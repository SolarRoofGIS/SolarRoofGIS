# The backend calculation tests and a CI-mode frontend build on every push and pull request.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend tests
        run: npm ci && npm test
        working-directory: backend
      - name: Frontend build
        run: npm ci && npm run build
        working-directory: frontend
        env:
          CI: true
