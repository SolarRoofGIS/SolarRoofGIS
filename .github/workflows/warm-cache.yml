# After a push to main, wait until Vercel serves that commit in production, then request the
# heavy API answers once so the first visitors do not wait for them (scripts/warm-cache.mjs).
name: Warm cache after deploy

on:
  push:
    branches: [main]

# A newer push supersedes an older warm-up that is still waiting.
concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/warm-cache.mjs https://solarroofgis.vercel.app --wait-for "$GITHUB_SHA"
