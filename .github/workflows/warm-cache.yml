# After Vercel finishes a production deployment, request the heavy API answers once so the
# first visitors do not wait for them (see scripts/warm-cache.mjs). Vercel reports each
# deployment as a commit status named "Vercel"; on main that is the production deployment.
name: Warm cache after deploy

on:
  status:

jobs:
  warm:
    if: github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/warm-cache.mjs https://solarroofgis.vercel.app
